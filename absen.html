<div class="container">


<h1>
✅ Absensi Siswa
</h1>




<div class="dashboard-grid">



<div class="card">

<h2>
🟢
</h2>

<h3>
Hadir
</h3>

<p id="jumlahHadir">
0
</p>

</div>




<div class="card">

<h2>
🟡
</h2>

<h3>
Izin
</h3>

<p id="jumlahIzin">
0
</p>

</div>





<div class="card">

<h2>
🔵
</h2>

<h3>
Sakit
</h3>

<p id="jumlahSakit">
0
</p>

</div>





<div class="card">

<h2>
🔴
</h2>

<h3>
Alfa
</h3>

<p id="jumlahAlfa">
0
</p>

</div>



</div>







<br>




<div class="card">


<h2>
Tambah Absensi
</h2>



<input 
id="namaAbsen"
placeholder="Nama Siswa">



<select id="statusAbsen">


<option>
Hadir
</option>


<option>
Izin
</option>


<option>
Sakit
</option>


<option>
Alfa
</option>



</select>



<input 
id="catatanAbsen"
placeholder="Catatan">





<button onclick="tambahAbsen()">
Simpan Absensi
</button>



</div>







<div class="card">


<h2>
Data Absensi
</h2>



<table>


<thead>

<tr>

<th>
No
</th>

<th>
Nama
</th>

<th>
Status
</th>

<th>
Catatan
</th>

<th>
Aksi
</th>

</tr>


</thead>



<tbody id="dataAbsen">

</tbody>



</table>



</div>
