<div class="container">


<h1>
👨‍🎓 Data Siswa
</h1>



<div class="card">


<h2>
Tambah Siswa
</h2>



<input 
type="text"
id="namaSiswa"
placeholder="Nama Siswa">



<input 
type="text"
id="nisSiswa"
placeholder="NIS">



<select id="jkSiswa">

<option>
Laki-laki
</option>

<option>
Perempuan
</option>


</select>



<button onclick="tambahSiswa()">
Tambah
</button>


</div>





<br>



<div class="card">


<h2>
Daftar Siswa
</h2>



<table>


<thead>

<tr>

<th>
No
</th>

<th>
Nama
</th>

<th>
NIS
</th>

<th>
Jenis Kelamin
</th>

<th>
Aksi
</th>


</tr>

</thead>



<tbody id="dataSiswa">


</tbody>



</table>


</div>
